name: Ana ekran derleme

on:
  push:
    branches: [ main ]
    paths: [ "tv-launcher/**", ".github/workflows/ana-ekran.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Imza anahtari
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 yok"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/launcher.log"; test ${PIPESTATUS[0]} -eq 0
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/AnaEkran.apk
      - name: Hata kaydi
        if: failure()
        working-directory: .
        run: |
          mkdir -p /tmp/cilog && tail -300 "$RUNNER_TEMP/launcher.log" > /tmp/cilog/launcher-tail.log 2>/dev/null || echo yok > /tmp/cilog/launcher-tail.log
          cd /tmp/cilog && git init -q && git checkout -q -b ci-logs-launcher
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -q -m "launcher log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs-launcher
      - name: Yayinla (Lina TV guncellemesini etkilemez)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ana-ekran
          target_commitish: ${{ github.sha }}
          name: Ana ekran (tv-launcher)
          prerelease: true
          make_latest: false
          files: tv-launcher/dist/AnaEkran.apk
          body: "Lina ana ekrani (cleanyourtv/tv-vibehack tabanli, MIT). Lina TV uygulamasinin guncellemesi degildir."
